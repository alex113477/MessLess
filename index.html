const P={"z":1,"s":"ocxXh1eLw05onl/oNQP0pw==","n":600000,"c":[{"i":"BgZ/s8p/XxbEZcGN","f":"c0.bin?v=a4fb6bbb3829","w":[{"i":"wTDb56An4tKzdjHO","k":"P8CgtvzOeM8fUetXIbL1uak6FGlU9GzfJN1zvsFI6aI2eoJf6wVZ4rc+qSPdU3PB"}]},{"i":"zZEiEgbsZZaE2Q5k","f":"c1.bin?v=f6b8bb528b19","w":[{"i":"Fji2AqGco5TeH1LO","k":"BBlgVpJ07uFcRXu00mQxgIWjoyOfsgksn2nOoeVlSXwQDz0BWt9ygNhlUz0LkHy1"}]}]};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// «Запомнить»: в браузере (IndexedDB) лежит не пароль, а ключ CryptoKey без права выгрузки — достать его как текст нельзя
const idb=(mode,fn)=>new Promise((ok,bad)=>{const r=indexedDB.open("ml",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");
  r.onsuccess=()=>{const tx=r.result.transaction("k",mode),q=fn(tx.objectStore("k"));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>bad(tx.error)};r.onerror=()=>bad(r.error)});
async function open_(pw,remember){
  if(!window.crypto||!crypto.subtle) throw new Error("nosubtle");
  if(P.z&&!window.DecompressionStream) throw new Error("old");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const pk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  await unlock(pk,remember?async()=>{try{await idb("readwrite",s=>s.put(pk,"pk"))}catch(e){}}:null);
}
async function unlock(pk,onOk){
  let raw=null,C=null;
  for(const c of P.c){for(const w of c.w){try{raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(w.i)},pk,b64(w.k));C=c;break}catch(x){}}if(raw)break}
  if(!raw) throw new Error("badpw");
  if(onOk) await onOk();   // запомнить ключ до того, как страница заменится отчётом
  // девиз во весь экран на несколько секунд — один раз за вкладку (тихие перезагрузки после сохранений его не показывают); клик — пропустить
  let hold=null;try{if(!sessionStorage.getItem("ml_sp")){sessionStorage.setItem("ml_sp","1");document.body.classList.add("sp");
    hold=new Promise(r=>{setTimeout(r,7000);document.addEventListener("click",r,{once:true});document.addEventListener("keydown",r,{once:true})})}}catch(x){}
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  let buf;
  try{const r=await fetch(C.f);if(!r.ok)throw new Error("net");buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(C.i)},key,await r.arrayBuffer());
    try{sessionStorage.removeItem("ml_rl")}catch(x){}}
  catch(x){   // страница входа из кэша старее файла сайта — один раз перезагружаемся свежей
    let again=false;try{again=!sessionStorage.getItem("ml_rl");sessionStorage.setItem("ml_rl","1")}catch(y){}
    if(again){try{await fetch(location.pathname,{cache:"reload"})}catch(y){}location.reload();return new Promise(()=>{})}
    try{sessionStorage.removeItem("ml_sp")}catch(y){}document.body.classList.remove("sp");throw new Error("load")}
  const html=P.z?await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
                 :new TextDecoder().decode(buf);
  if(hold) await hold;
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),e=document.getElementById("e"),bt=document.getElementById("b");
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="";bt.disabled=true;bt.textContent="Открываю…";
  try{await open_(document.getElementById("pw").value,document.getElementById("rm").checked)}
  catch(x){e.textContent=x.message==="nosubtle"?"Браузер не поддерживает расшифровку — откройте ссылку по https":x.message==="old"?"Браузер устарел — обновите его":x.message==="load"?"Не удалось загрузить сайт — проверьте интернет и обновите страницу":"Неверный пароль";bt.disabled=false;bt.textContent="Открыть"}});
(async()=>{try{localStorage.removeItem("ml_pw")}catch(x){}   // старый способ хранил сам пароль — стираем
  let pk=null;try{pk=await idb("readonly",s=>s.get("pk"))}catch(x){}
  if(pk){try{await unlock(pk)}catch(x){try{await idb("readwrite",s=>s.delete("pk"))}catch(y){}}}})();
